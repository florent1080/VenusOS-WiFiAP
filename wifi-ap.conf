# WiFi Access Point configuration for VenusOS-WiFiAP
#
# Edit these values to match your setup.
# This file is preserved on reinstall.
#
# Changes take effect at the next AP start: toggle the access point off/on
# in the UI (Settings > Wi-Fi) or run: svc -t /service/hostapd
#
# Values are read literally (the file is not executed): spaces are fine,
# do not add surrounding quotes.

# WiFi network name (SSID)
SSID=ZeVan

# Fallback WPA2 password (8-63 characters).
# Only used when /Settings/Services/AccessPointPassword (the password the
# Victron UI edits) is empty or invalid.
PASSWORD=victron1234

# Fallback WiFi channel (1-13, 2.4 GHz), used when the WiFi client (wlan0)
# is not connected - typically in the van - or is parked on a DFS channel.
# When wlan0 IS connected, the AP automatically follows its channel
# (single-radio constraint of the Raspberry Pi WiFi chip).
CHANNEL=1

# IP address of the Pi on the AP network (gateway for clients)
AP_IP=192.168.0.1

# DHCP range for clients
DHCP_START=192.168.0.100
DHCP_END=192.168.0.200
DHCP_LEASE=12h

# Interfaces (defaults are right for every known setup)
IFACE=wlan0
AP_IFACE=ap0
